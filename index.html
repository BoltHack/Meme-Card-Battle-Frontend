<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--    <link rel="icon" type="image/svg+xml" href="/vite.svg" />-->
    <!--      <link rel="icon" type="image/png" href="./src/assets/icon/icon.png" />-->
    <link
      rel="icon"
      type="image/svg+xml"
      href="./src/assets/icon/Icon_Svg.svg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--    <title>Vite + React + TS</title>-->
  </head>
  <body>
    <noscript>
      <title>Включите JavaScript</title>
      <style>
        html {
          scrollbar-width: thin;
        }
        body {
          margin: 0;
          width: 100%;
          height: 100dvh;
          font-family:
            -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
            Arial, sans-serif;
          color: #e2e8f0;
          line-height: 1.5;
          overflow-y: auto;
          overflow-x: hidden;
          scroll-behavior: smooth;
          scrollbar-width: thin;
          background-color: #0b0518;
          background-image:
            radial-gradient(rgba(255, 255, 255, 0.05) 15%, transparent 15%),
            radial-gradient(
              circle at 10% 90%,
              rgba(255, 0, 127, 0.25),
              transparent 45%
            ),
            radial-gradient(
              circle at 90% 10%,
              rgba(0, 102, 255, 0.25),
              transparent 45%
            ),
            radial-gradient(circle at 50% 50%, #150931, #06020c);
          background-size:
            24px 24px,
            100% 100%,
            100% 100%,
            100% 100%;
          background-attachment: fixed;

          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
          box-sizing: border-box;
        }

        .noscript-container {
          max-width: 520px;
          width: 100%;
          background: rgba(21, 9, 49, 0.4);
          border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 24px;
          padding: 40px 32px;
          box-shadow:
            0 20px 40px rgba(0, 0, 0, 0.5),
            0 0 50px rgba(0, 102, 255, 0.05);
          backdrop-filter: blur(16px);
          -webkit-backdrop-filter: blur(16px);
          animation: containerAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1);
          box-sizing: border-box;
        }

        .noscript-header {
          text-align: center;
          margin-bottom: 32px;
        }

        .noscript-icon {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          width: 56px;
          height: 56px;
          background: linear-gradient(
            135deg,
            rgba(255, 0, 127, 0.15),
            rgba(0, 102, 255, 0.15)
          );
          border: 1px solid rgba(255, 0, 127, 0.3);
          border-radius: 16px;
          margin-bottom: 20px;
          font-size: 26px;
        }

        .noscript-title {
          font-size: 24px;
          font-weight: 700;
          margin: 0 0 10px 0;
          color: #ffffff;
          letter-spacing: -0.5px;
        }

        .noscript-text {
          font-size: 14px;
          color: #94a3b8;
          margin: 0;
        }

        .browser-list {
          display: flex;
          flex-direction: column;
          gap: 12px;
          margin-bottom: 32px;
        }

        .browser-item {
          border: 1px solid rgba(255, 255, 255, 0.05);
          background: rgba(255, 255, 255, 0.01);
          border-radius: 16px;
          overflow: hidden;
          display: grid;
          grid-template-rows: auto 0fr;
          transition:
            grid-template-rows 0.4s cubic-bezier(0.25, 1, 0.5, 1),
            border-color 0.4s cubic-bezier(0.25, 1, 0.5, 1),
            background-color 0.4s cubic-bezier(0.25, 1, 0.5, 1),
            box-shadow 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .browser-item[open] {
          grid-template-rows: auto 1fr;
          border-color: rgba(0, 102, 255, 0.35);
          background: rgba(0, 102, 255, 0.03);
          box-shadow: inset 0 0 15px rgba(0, 102, 255, 0.05);
        }

        summary {
          list-style: none;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 18px 24px;
          font-size: 15px;
          font-weight: 600;
          color: #cbd5e1;
          cursor: pointer;
          user-select: none;
          transition: color 0.3s ease;
        }

        summary::-webkit-details-marker {
          display: none;
        }

        summary:hover {
          color: #ffffff;
        }

        summary::after {
          content: "→";
          font-weight: 400;
          color: #64748b;
          font-size: 16px;
          transition:
            transform 0.5s cubic-bezier(0.25, 1, 0.5, 1),
            color 0.4s ease;
        }

        .browser-item[open] summary::after {
          transform: rotate(90deg);
          color: #0066ff;
        }

        .browser-content-wrapper {
          overflow: hidden;
        }

        .browser-content {
          padding: 0 24px 20px 24px;
          font-size: 14px;
          color: #94a3b8;
          line-height: 1.6;
          opacity: 0;
          transform: translateY(-8px);
          transition:
            opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1),
            transform 0.4s cubic-bezier(0.25, 1, 0.5, 1),
            color 0.4s ease;
        }

        .browser-item[open] .browser-content {
          opacity: 1;
          transform: translateY(0);
          color: #cbd5e1;
          transition-delay: 0.05s;
        }

        .browser-content code {
          background: rgba(255, 0, 127, 0.12);
          color: #ff4da6;
          padding: 3px 6px;
          border-radius: 6px;
          font-family:
            ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
          font-size: 13px;
          border: 1px solid rgba(255, 0, 127, 0.15);
        }

        .noscript-button {
          display: inline-block;
          width: 100%;
          padding: 14px 24px;
          background: linear-gradient(135deg, #ff007f, #0066ff);
          color: #ffffff;
          border: none;
          border-radius: 12px;
          font-size: 15px;
          font-weight: 600;
          text-decoration: none;
          text-align: center;
          cursor: pointer;
          box-shadow: 0 4px 12px rgba(0, 102, 255, 0.25);
          transition:
            transform 0.2s ease,
            filter 0.2s ease;
          box-sizing: border-box;
        }

        .noscript-button:hover {
          filter: brightness(1.1);
          transform: translateY(-1px);
        }

        @keyframes containerAppear {
          from {
            opacity: 0;
            transform: scale(0.97) translateY(15px);
            filter: blur(4px);
          }
          to {
            opacity: 1;
            transform: scale(1) translateY(0);
            filter: blur(0);
          }
        }

        @keyframes slideDown {
          from {
            opacity: 0;
            transform: translateY(-8px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
      </style>
      <body>
        <div class="noscript-container">
          <div class="noscript-header">
            <div class="noscript-icon">⚙️</div>
            <h1 class="noscript-title">Включите JavaScript</h1>
            <p class="noscript-text">
              Для работы сайта необходимы активные скрипты. Выберите ваш
              браузер, чтобы посмотреть инструкцию:
            </p>
          </div>

          <div class="browser-list">
            <details class="browser-item" name="browser">
              <summary>Google Chrome</summary>
              <div class="browser-content-wrapper">
                <div class="browser-content">
                  Откройте настройки → Конфиденциальность и безопасность →
                  Настройки сайта → JavaScript → Переведите переключатель в
                  положение
                  <b>Включено</b>.
                </div>
              </div>
            </details>

            <details class="browser-item" name="browser">
              <summary>Mozilla Firefox</summary>
              <div class="browser-content-wrapper">
                <div class="browser-content">
                  Введите <code>about:config</code> в адресной строке →
                  Подтвердите риск → Найдите параметр
                  <code>javascript.enabled</code> → Установите его значение в
                  <code>true</code>.
                </div>
              </div>
            </details>

            <details class="browser-item" name="browser">
              <summary>Safari</summary>
              <div class="browser-content-wrapper">
                <div class="browser-content">
                  Откройте настройки → Вкладка «Безопасность» → Поставьте
                  галочку напротив опции <b>Включить JavaScript</b>.
                </div>
              </div>
            </details>

            <details class="browser-item" name="browser">
              <summary>Microsoft Edge</summary>
              <div class="browser-content-wrapper">
                <div class="browser-content">
                  Перейдите в параметры → Файлы cookie и разрешения сайта →
                  Найдите пункт <b>JavaScript</b> → Установите переключатель в
                  положение <b>Включено</b>.
                </div>
              </div>
            </details>
          </div>

          <a href="." class="noscript-button">Я включил, обновить страницу</a>
        </div>
      </body>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
