  <body>
    <noscript>
      <!doctype html>
      <html lang="ru">
        <head>
          <meta charset="UTF-8" />
          <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
          />
          <title>Включите JavaScript</title>
          <style>
            html {
              scrollbar-width: thin;
            }
            body {
              margin: 0;
              width: 100%;
              min-height: 100dvh;
              font-family:
                -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                Helvetica, Arial, sans-serif;
              color: #e2e8f0;
              line-height: 1.5;
              overflow-y: auto;
              overflow-x: hidden;
              scroll-behavior: smooth;
              scrollbar-width: thin;
              background-color: #0b0518;
              background-image:
                radial-gradient(rgba(255, 255, 255, 0.05) 15%, transparent 15%),
                radial-gradient(
                  circle at 10% 90%,
                  rgba(255, 0, 127, 0.25),
                  transparent 45%
                ),
                radial-gradient(
                  circle at 90% 10%,
                  rgba(0, 102, 255, 0.25),
                  transparent 45%
                ),
                radial-gradient(circle at 50% 50%, #150931, #06020c);
              background-size:
                24px 24px,
                100% 100%,
                100% 100%,
                100% 100%;
              background-attachment: fixed;

              display: flex;
              align-items: center;
              justify-content: center;
              padding: 40px 20px;
              box-sizing: border-box;
            }

            .noscript-container {
              max-width: 1100px;
              width: 100%;
              background: rgba(21, 9, 49, 0.4);
              border: 1px solid rgba(255, 255, 255, 0.08);
              border-radius: 28px;
              padding: 50px 40px;
              box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.5),
                0 0 60px rgba(0, 102, 255, 0.06);
              backdrop-filter: blur(16px);
              -webkit-backdrop-filter: blur(16px);
              animation: containerAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1);
              box-sizing: border-box;
            }

            .noscript-header {
              text-align: center;
              margin-bottom: 40px;
            }

            .noscript-icon {
              display: inline-flex;
              align-items: center;
              justify-content: center;
              width: 64px;
              height: 64px;
              background: linear-gradient(
                135deg,
                rgba(255, 0, 127, 0.15),
                rgba(0, 102, 255, 0.15)
              );
              border: 1px solid rgba(255, 0, 127, 0.3);
              border-radius: 18px;
              margin-bottom: 20px;
              font-size: 30px;
            }

            .noscript-title {
              font-size: 32px;
              font-weight: 700;
              margin: 0 0 12px 0;
              color: #ffffff;
              letter-spacing: -0.5px;
            }

            .noscript-text {
              font-size: 16px;
              color: #94a3b8;
              margin: 0;
            }

            .browser-grid {
              display: grid;
              grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
              gap: 24px;
              margin-bottom: 40px;
            }

            .browser-card {
              background: rgba(255, 255, 255, 0.02);
              border: 1px solid rgba(255, 255, 255, 0.06);
              border-radius: 20px;
              padding: 32px;
              display: flex;
              flex-direction: column;
              justify-content: space-between;
              min-height: 200px;
              transition: all 0.3s ease;
              box-sizing: border-box;
            }

            .browser-card:hover {
              border-color: rgba(0, 102, 255, 0.35);
              background: rgba(0, 102, 255, 0.03);
              /* transform: translateY(-3px); */
              box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            }

            .browser-card-title {
              font-size: 20px;
              font-weight: 600;
              color: #ffffff;
              margin: 0 0 14px 0;
              display: flex;
              align-items: center;
              gap: 10px;
            }

            .browser-card-desc {
              font-size: 15px;
              color: #94a3b8;
              margin: 0 0 20px 0;
              line-height: 1.6;
            }

            .setting-link-box {
              margin-top: auto;
              background: rgba(0, 0, 0, 0.3);
              border: 1px solid rgba(255, 255, 255, 0.06);
              border-radius: 12px;
              padding: 12px 16px;
              display: flex;
              flex-direction: column;
              gap: 6px;
            }

            .setting-link-label {
              font-size: 11px;
              text-transform: uppercase;
              letter-spacing: 0.5px;
              color: #64748b;
              font-weight: 600;
            }

            .setting-link-box code,
            .setting-link-box a {
              font-family:
                ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
              font-size: 14px;
              color: #ff4da6;
              word-break: break-all;
              text-decoration: none;
            }

            .setting-link-box a:hover {
              cursor: text;
              /* text-decoration: underline; */
            }
            .setting-link-box a:active {
              user-select: all;
            }

            .browser-card code {
              background: rgba(255, 0, 127, 0.12);
              color: #ff4da6;
              padding: 3px 6px;
              border-radius: 6px;
              font-family:
                ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
              font-size: 14px;
              border: 1px solid rgba(255, 0, 127, 0.15);
            }

            .noscript-button {
              display: inline-block;
              width: 100%;
              padding: 16px 24px;
              background: linear-gradient(135deg, #ff007f, #0066ff);
              color: #ffffff;
              border: none;
              border-radius: 14px;
              font-size: 16px;
              font-weight: 600;
              text-decoration: none;
              text-align: center;
              cursor: pointer;
              box-shadow: 0 4px 20px rgba(0, 102, 255, 0.3);
              transition:
                transform 0.2s ease,
                filter 0.2s ease;
              box-sizing: border-box;
            }

            .noscript-button:hover {
              filter: brightness(1.1);
            }

            @keyframes containerAppear {
              from {
                opacity: 0;
                transform: scale(0.97) translateY(15px);
                filter: blur(4px);
              }
              to {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0);
              }
            }
          </style>
        </head>
        <body>
          <div class="noscript-container">
            <div class="noscript-header">
              <div class="noscript-icon">⚙️</div>
              <h1 class="noscript-title">Требуется включить JavaScript</h1>
              <p class="noscript-text">
                Для корректной работы сайта необходимо включить JavaScript в
                вашем браузере. Выберите ваш браузер ниже, чтобы узнать
                инструкцию:
              </p>
            </div>

            <div class="browser-grid">
              <div class="browser-card">
                <div>
                  <h3 class="browser-card-title">Google Chrome</h3>
                  <p class="browser-card-desc">
                    Настройки → Конфиденциальность и безопасность → Настройки
                    сайта → JavaScript → выберите
                    <b>«Разрешить сайтам использовать JavaScript»</b>.
                  </p>
                </div>
                <span class="setting-link-label">
                  Скопируйте и вставьте в адресную строку:
                </span>
                <div class="setting-link-box">
                  <a>chrome://settings/content/javascript</a>
                </div>
              </div>

              <div class="browser-card">
                <div>
                  <h3 class="browser-card-title">Mozilla Firefox</h3>
                  <p class="browser-card-desc">
                    Введите в адресную строку <code>about:config</code>,
                    подтверрите предупреждение, найдите параметр
                    <code>javascript.enabled</code> и установите его в значение
                    <code>true</code>.
                  </p>
                </div>
                <span class="setting-link-label">
                  Скопируйте и вставьте в адресную строку:
                </span>
                <div class="setting-link-box">
                  <!-- <span class="setting-link-label">Путь в браузере:</span> -->
                  <a>about:config</a>
                </div>
              </div>

              <div class="browser-card">
                <div>
                  <h3 class="browser-card-title">Яндекс Браузер</h3>
                  <p class="browser-card-desc">
                    Настройки → Сайты → Расширенные настройки сайтов →
                    JavaScript → выберите <b>«Разрешить JavaScript»</b>.
                  </p>
                </div>
                <span class="setting-link-label">
                  Скопируйте и вставьте в адресную строку:
                </span>
                <div class="setting-link-box">
                  <a>about:config</a>
                </div>
              </div>

              <div class="browser-card">
                <div>
                  <h3 class="browser-card-title">Microsoft Edge</h3>
                  <p class="browser-card-desc">
                    Параметры → Файлы cookie и разрешения сайта → JavaScript →
                    переведите переключатель в положение <b>«Разрешено»</b>.
                  </p>
                </div>
                <span class="setting-link-label">
                  Скопируйте и вставьте в адресную строку:
                </span>
                <div class="setting-link-box">
                  <a
                    >edge://settings/privacy/sitePermissions/allPermissions/javaScript</a
                  >
                </div>
              </div>

              <div class="browser-card" style="grid-column: 1 / -1">
                <div>
                  <h3 class="browser-card-title">Safari (macOS / iOS)</h3>
                  <p class="browser-card-desc">
                    Откройте Настройки браузера → перейдите во вкладку
                    <b>«Безопасность»</b> (или раздел «Дополнительно» на iOS) →
                    поставьте галочку напротив пункта
                    <b>«Включить JavaScript»</b>.
                  </p>
                </div>
              </div>
            </div>

            <a href="/" class="noscript-button">Я включил, обновить страницу</a>
          </div>
        </body>
      </html>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
